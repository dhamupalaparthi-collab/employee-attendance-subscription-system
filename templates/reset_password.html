<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="main">
        <div class="card center-box">

            <h2>Reset password</h2>
            <p class="hint">Enter the code from your email, your username, and a new password.</p>

            <form action="/reset-password" method="POST" autocomplete="off">
                <input name="username" placeholder="Username" required autocomplete="off">
                <input name="otp" placeholder="Reset code from email" required inputmode="numeric" pattern="[0-9]{6}" autocomplete="off">
                <input name="password" type="password" placeholder="New password" required autocomplete="new-password">
                <input name="password2" type="password" placeholder="Confirm new password" required autocomplete="new-password">
                <button type="submit">Update password</button>
            </form>

            <p class="forgot-nav"><a href="/forgot-password">Request a new code</a></p>
            <p class="forgot-nav"><a href="/">Back to login</a></p>

        </div>
    </div>

</body>

</html>
