<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Employee</h2>
            <a href="/mark_attendance">Mark attendance</a>
            <a href="/view_subscriptions">View subscriptions</a>
            <a href="/request_subscription">Request subscription</a>
            <a href="/view_my_attendance">View my attendance</a>
            <a href="/request_holiday">Request holiday</a>
            <a href="/change_weekly_holiday">Change weekly holiday</a>
            <a href="/logout">Logout</a>
        </div>

        <div class="main">
            <div class="card">
                <h2>Request Admin for Subscription</h2>
                <p class="hint">Select the subscriptions you want to request access to.</p>

                <form action="/request_subscription" method="POST" autocomplete="off">
                    <label>Subscriptions to request</label>
                    <div class="sub-box sub-grid">{{SUB_CHECKS}}</div>

                    <button type="submit">Request</button>
                </form>

                <p class="back-link"><a href="/employee">Back</a></p>
            </div>
        </div>
    </div>

</body>

</html>
