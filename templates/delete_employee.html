<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">

                <p class="back-link"><a href="/manage_employees">Back</a></p>

        </div>
