<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="main">
        <div class="card center-box">

            <h2>Forgot password</h2>
            <p class="hint">For <strong>employee</strong> accounts only. Enter your username; a reset code is sent to the admin email (same inbox used for OTP).</p>
            <p class="hint">The admin login (<strong>dhamu</strong>) cannot be reset here.</p>

            <form action="/forgot-password" method="POST" autocomplete="off">
                <input name="username" placeholder="Username" required autocomplete="off">
                <button type="submit">Send reset code</button>
            </form>

            <p class="forgot-nav"><a href="/reset-password">I already have a code</a></p>
            <p class="forgot-nav"><a href="/">Back to login</a></p>

        </div>
    </div>

</body>

</html>
