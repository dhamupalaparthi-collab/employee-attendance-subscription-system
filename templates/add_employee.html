<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Admin</h2>
            <a href="/manage_employees">Manage employees</a>
            <a href="/manage_subscriptions">Manage subscriptions</a>
            <a href="/attendance">View attendance</a>
            <a href="/employee_requests">Requests from employees</a>
            <a href="/logout">Logout</a>
        </div>

        <div class="main">
            <div class="card">
                <h2>Add employee</h2>

                <form action="/add_employee" method="POST" enctype="multipart/form-data" autocomplete="off">

                    <input name="username" placeholder="Username" required>
                    <input name="password" type="password" placeholder="Password" required>
                    <input name="email" type="email" placeholder="Email" required>

                    <label>Role</label>
                    <input name="role" placeholder="Role" required>

                    <label>Weekly Holiday</label>
                    <select name="weekly_holiday" required>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                    </select>

                    <label>Profile Photo</label>
                    <input type="file" name="photo" accept="image/*" required>

                    <label>Subscriptions this employee can use</label>
                    <div class="sub-box">{{SUBS}}</div>

                    <button type="submit">Add employee</button>
                </form>

                <p class="back-link"><a href="/manage_employees">Back</a></p>
            </div>
        </div>
    </div>

</body>

</html>
