<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Employee</h2>
            <a href="/mark_attendance">Mark attendance</a>
            <a href="/view_subscriptions">View subscriptions</a>
            <a href="/request_subscription">Request subscription</a>
            <a href="/view_my_attendance">View my attendance</a>
            <a href="/request_holiday">Request holiday</a>
            <a href="/change_weekly_holiday">Change weekly holiday</a>
            <a href="/logout">Logout</a>
        </div>

        <div class="main">
            <div class="card">
                <h2>Request Holiday</h2>
                <p class="hint">Submit a holiday request for today or a future date.</p>
                <form action="/request_holiday" method="POST" autocomplete="off">
                    <label>Date</label>
                    <input type="date" name="date" required>

                    <label>Reason</label>
                    <textarea name="reason" rows="4" required></textarea>

                    <button type="submit">Submit request</button>
                </form>

                <p class="back-link"><a href="/employee">Back</a></p>
            </div>
        </div>
    </div>

</body>

</html>
