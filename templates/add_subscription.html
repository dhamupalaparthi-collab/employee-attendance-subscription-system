<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Admin</h2>
            <a href="/manage_employees">Manage employees</a>
            <a href="/manage_subscriptions">Manage subscriptions</a>
            <a href="/attendance">View attendance</a>
            <a href="/employee_requests">Requests from employees</a>
            <a href="/logout">Logout</a>
        </div>

        <div class="main">
            <div class="card">
                <h2>Add subscription</h2>

                <form action="/add_subscription" method="POST" autocomplete="off">
                    <input name="name" placeholder="Subscription name" required>
                    <input name="password" type="password" placeholder="Subscription password" required>
                    <button type="submit">Add</button>
                </form>

                <p class="back-link"><a href="/manage_subscriptions">Back</a></p>
            </div>
        </div>
    </div>

</body>

</html>
